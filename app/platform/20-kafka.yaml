# Kafka 3.7 (KRaft, single broker, no ZooKeeper).
# The advertised listener is `kafka:9092` — the Service name — exactly like
# the docker-compose network alias, so clients need no changes.
# Topics are created by the kafka-init Job (50-init-jobs.yaml).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: bankobs
  labels: { app: kafka, tier: data }
spec:
  selector: { app: kafka }
  # The KRaft controller bootstraps by dialling itself at kafka:9093 before
  # the pod is Ready — without this the Service has no endpoints yet and
  # startup deadlocks.
  publishNotReadyAddresses: true
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
    - { name: controller, port: 9093, targetPort: 9093 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: bankobs
  labels: { app: kafka, tier: data }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata:
      labels: { app: kafka, tier: data }
    spec:
      # apache/kafka runs as uid/gid 1000 (appuser). The gp3 PVC mounts root-owned,
      # so the broker can't write meta.properties when formatting KAFKA_LOG_DIRS on
      # the volume. fsGroup chowns the mount to gid 1000 → writable.
      securityContext:
        fsGroup: 1000
      # A freshly-formatted ext4 EBS volume has a root-owned lost+found at its root.
      # Kafka's LogManager scans KAFKA_LOG_DIRS and dies on any entry that isn't a
      # topic-partition dir ("Error starting LogManager"), so remove it before boot.
      initContainers:
        - name: rm-lost-found
          image: apache/kafka:3.7.0
          command: ["sh", "-c", "rm -rf /var/lib/kafka/data/lost+found || true"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - { containerPort: 9092 }
            - { containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: BankObserve360Cluster1A }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            # Persist the log on the PVC. Without this, apache/kafka defaults log.dirs
            # to /tmp/kafka-logs (ephemeral container fs), so the PVC at
            # /var/lib/kafka/data went unused and every topic was lost on reschedule.
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
          # Probes do a plain TCP check on the broker port, NOT `kafka-topics.sh`:
          # the CLI launches a full JVM on every probe, which under CPU contention
          # routinely exceeds the timeout and gets the (healthy) broker killed →
          # CrashLoopBackOff. A single broker listening on 9092 is ready.
          startupProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 10Gi } }

replicaCount: 1
image:
  registry: public.ecr.aws/w8x4g9h7/obs-v1   # override with YOUR ECR (make deploy ECR=...) to run your own build
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  port: 8003
domain: core-banking
otel:
  endpoint: http://otel-collector.obs.internal:4317
observabilityMode: full
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 512Mi }

# Image-defect workaround (see _generate.sh): the published image's application.yml fails to parse
# and crash-loops the pod; mount a corrected copy at /config and point the JVM at it.
configOverride:
  file: application.yml
  env: { name: SPRING_CONFIG_LOCATION, value: "optional:file:/config/application.yml" }

# BankObs application RED — the consolidated copy of bankobs-red-spanmetrics.yaml.
#
# The per-service board is one service at a time. This one is the whole application:
# every SPAN_KIND_SERVER series, summed. The Service variable defaults to All
# (regex .*) and is multi-select, so the same board can narrow to a subset.
# A row in the table opens the per-service RED or health board for that service.
#
# Click-through (datasource-level, panels inherit it):
#   metric exemplar --trace_id--> Jaeger trace --tracesToLogsV2--> Loki logs
#
# Apply with: kubectl --context obs-v1-observability apply -f bankobs-app-red-spanmetrics.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankobs-app-red-spanmetrics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "BankObs"
data:
  bankobs-app-red-spanmetrics.json: |
    {
      "uid": "bankobs-app-red",
      "title": "BankObs — Application RED (spanmetrics)",
      "description": "Consolidated RED for the whole BankObs application. Service defaults to All. Table rows open the per-service boards.",
      "tags": ["bankobs", "metrics", "red", "spanmetrics", "application"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "links": [
        { "title": "Per-service RED", "type": "link", "icon": "dashboard", "keepTime": true, "url": "/d/bankobs-red-spanmetrics" },
        { "title": "Application health", "type": "link", "icon": "dashboard", "keepTime": true, "url": "/d/bankobs-app-health" },
        { "title": "Per-service health", "type": "link", "icon": "dashboard", "keepTime": true, "url": "/d/bankobs-svc-health" }
      ],
      "templating": {
        "list": [
          { "name": "ds_prom", "label": "Prometheus", "type": "datasource", "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" } },
          { "name": "ds_loki", "label": "Loki", "type": "datasource", "query": "loki",
            "current": { "text": "Loki", "value": "loki" } },
          { "name": "ds_jaeger", "label": "Jaeger", "type": "datasource", "query": "jaeger",
            "current": { "text": "Jaeger", "value": "jaeger" } },
          { "name": "service", "label": "Service", "type": "query",
            "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "definition": "label_values(calls_total{span_kind=\"SPAN_KIND_SERVER\"}, service_name)",
            "query": { "query": "label_values(calls_total{span_kind=\"SPAN_KIND_SERVER\"}, service_name)", "refId": "sm" },
            "refresh": 2, "sort": 1, "includeAll": true, "allValue": ".*", "multi": true,
            "current": { "text": "All", "value": "$__all", "selected": true } }
        ]
      },
      "panels": [
        { "id": 1, "type": "row", "title": "Application RED", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false },

        { "id": 2, "type": "stat", "title": "Request rate (req/s)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "sum(rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))" } ] },

        { "id": 3, "type": "stat", "title": "Error rate (%)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 2, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "100 * sum(rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval])) / clamp_min(sum(rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])), 0.001)" } ] },

        { "id": 4, "type": "stat", "title": "Latency p95 (ms)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "ms", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 1000 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "histogram_quantile(0.95, sum by (le) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))" } ] },

        { "id": 5, "type": "stat", "title": "Latency p99 (ms)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "ms", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1000 }, { "color": "red", "value": 2500 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "histogram_quantile(0.99, sum by (le) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))" } ] },

        { "id": 6, "type": "timeseries", "title": "Request rate by status_code",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "stacking": { "mode": "normal" }, "fillOpacity": 30 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "sum by (status_code) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
            "legendFormat": "{{status_code}}" } ] },

        { "id": 7, "type": "timeseries", "title": "Latency p50 / p95 / p99 (ms) — exemplars → trace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [
            { "refId": "p50", "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "exemplar": true,
              "expr": "histogram_quantile(0.50, sum by (le) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))", "legendFormat": "p50" },
            { "refId": "p95", "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "exemplar": true,
              "expr": "histogram_quantile(0.95, sum by (le) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))", "legendFormat": "p95" },
            { "refId": "p99", "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "exemplar": true,
              "expr": "histogram_quantile(0.99, sum by (le) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))", "legendFormat": "p99" } ] },

        { "id": 8, "type": "row", "title": "By service", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 }, "collapsed": false },

        { "id": 9, "type": "timeseries", "title": "Request rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "topk(12, sum by (service_name) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))",
            "legendFormat": "{{service_name}}" } ] },

        { "id": 10, "type": "timeseries", "title": "Error rate by service (%)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "percent", "custom": { "drawStyle": "line", "fillOpacity": 10 },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "topk(12, 100 * sum by (service_name) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval])) / clamp_min(sum by (service_name) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])), 0.001))",
            "legendFormat": "{{service_name}}" } ] },

        { "id": 11, "type": "timeseries", "title": "Latency p95 by service (ms)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "drawStyle": "line", "fillOpacity": 5 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "topk(10, histogram_quantile(0.95, sum by (le, service_name) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))))",
            "legendFormat": "{{service_name}}" } ] },

        { "id": 12, "type": "table", "title": "Services (click a service → per-service boards)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "options": { "sortBy": [ { "displayName": "Error %", "desc": true } ] },
          "targets": [
            { "refId": "A", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
              "expr": "sum by (service_name) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))" },
            { "refId": "B", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
              "expr": "100 * sum by (service_name) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\", status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval])) / clamp_min(sum by (service_name) (rate(calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])), 0.001)" },
            { "refId": "C", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(duration_milliseconds_bucket{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval])))" }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "service_name", "mode": "outer" } },
            { "id": "organize", "options": { "excludeByName": { "Time": true, "Time 1": true, "Time 2": true },
              "renameByName": { "service_name": "Service", "Value #A": "Req/s", "Value #B": "Error %", "Value #C": "p95 ms" },
              "indexByName": { "Service": 0, "Req/s": 1, "Error %": 2, "p95 ms": 3 } } }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "Service" }, "properties": [
                { "id": "links", "value": [
                  { "title": "Per-service RED", "url": "/d/bankobs-red-spanmetrics?var-service=${__data.fields.Service}&${__url_time_range}" },
                  { "title": "Per-service health", "url": "/d/bankobs-svc-health?var-service=${__data.fields.Service}&${__url_time_range}" }
                ] }
              ] },
              { "matcher": { "id": "byName", "options": "Req/s" }, "properties": [ { "id": "unit", "value": "reqps" }, { "id": "decimals", "value": 2 } ] },
              { "matcher": { "id": "byName", "options": "Error %" }, "properties": [
                { "id": "unit", "value": "percent" }, { "id": "decimals", "value": 2 },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } },
                { "id": "custom.cellOptions", "value": { "type": "color-background" } }
              ] },
              { "matcher": { "id": "byName", "options": "p95 ms" }, "properties": [ { "id": "unit", "value": "ms" }, { "id": "decimals", "value": 0 } ] }
            ]
          }
        },

        { "id": 13, "type": "row", "title": "Error logs (trace_id → Jaeger)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 }, "collapsed": false },

        { "id": 14, "type": "logs", "title": "Error logs — application",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 31 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "options": { "showTime": true, "showLabels": true, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" },
          "targets": [ { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" }, "maxLines": 300,
            "expr": "{service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b`" } ] }
      ]
    }

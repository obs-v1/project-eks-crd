# Kubernetes cluster-state across BOTH clusters — from the OTel k8s_cluster receiver (the
# OTel-native replacement for kube-state-metrics). Workload desired-vs-ready, pod phases, node
# capacity. $cluster defaults to All (both clusters); every series carries k8s_cluster_name.
#
# Apply with: kubectl --context obs-v1-observability apply -f k8s-cluster-state-otel.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-cluster-state-otel
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "BankObs"
data:
  k8s-cluster-state-otel.json: |
    {
      "uid": "k8s-cluster-state-otel",
      "title": "Kubernetes — Cluster State (OTel)",
      "tags": ["kubernetes", "metrics", "otel", "k8s-cluster", "state"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          { "name": "ds_prom", "label": "Prometheus", "type": "datasource", "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" } },
          { "name": "cluster", "label": "Cluster", "type": "query",
            "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "definition": "label_values(k8s_pod_phase, k8s_cluster_name)",
            "query": { "query": "label_values(k8s_pod_phase, k8s_cluster_name)", "refId": "cl" },
            "refresh": 2, "sort": 1, "includeAll": true, "allValue": ".*",
            "current": { "text": "All", "value": "$__all" } }
        ]
      },
      "panels": [
        { "type": "row", "title": "Workload readiness — $cluster", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },

        { "type": "stat", "title": "Deployments degraded",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "count((k8s_deployment_desired{k8s_cluster_name=~\"$cluster\"} - k8s_deployment_available{k8s_cluster_name=~\"$cluster\"}) > 0) or on() vector(0)" } ] },

        { "type": "stat", "title": "StatefulSets degraded",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "count((k8s_statefulset_desired_pods{k8s_cluster_name=~\"$cluster\"} - k8s_statefulset_ready_pods{k8s_cluster_name=~\"$cluster\"}) > 0) or on() vector(0)" } ] },

        { "type": "stat", "title": "DaemonSets degraded",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "count((k8s_daemonset_desired_scheduled_nodes{k8s_cluster_name=~\"$cluster\"} - k8s_daemonset_ready_nodes{k8s_cluster_name=~\"$cluster\"}) > 0) or on() vector(0)" } ] },

        { "type": "stat", "title": "Pods NOT Running",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "count(k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 1 or k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 4 or k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 5) or on() vector(0)" } ] },

        { "type": "row", "title": "Deployments — missing replicas (desired − available)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 } },

        { "type": "table", "title": "Workloads short of desired (click to investigate)",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "targets": [ { "refId": "A", "instant": true, "format": "table", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "(k8s_deployment_desired{k8s_cluster_name=~\"$cluster\"} - k8s_deployment_available{k8s_cluster_name=~\"$cluster\"}) > 0" } ],
          "transformations": [ { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "deployment_environment": true, "k8s_deployment_uid": true, "otel_scope_name": true, "otel_scope_version": true },
            "renameByName": { "k8s_cluster_name": "Cluster", "k8s_namespace_name": "Namespace", "k8s_deployment_name": "Deployment", "Value": "Missing replicas" } } } ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto" } }, "overrides": [ { "matcher": { "id": "byName", "options": "Missing replicas" }, "properties": [ { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } ] } ] } },

        { "type": "row", "title": "Pods by phase", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 } },

        { "type": "timeseries", "title": "Pods by phase (count)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "stacking": { "mode": "normal" }, "fillOpacity": 30 } } },
          "targets": [
            { "refId": "run",  "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "legendFormat": "Running",   "expr": "count(k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 2) or on() vector(0)" },
            { "refId": "pend", "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "legendFormat": "Pending",   "expr": "count(k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 1) or on() vector(0)" },
            { "refId": "fail", "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "legendFormat": "Failed",    "expr": "count(k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 4) or on() vector(0)" },
            { "refId": "unk",  "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "legendFormat": "Unknown",   "expr": "count(k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 5) or on() vector(0)" },
            { "refId": "succ", "datasource": { "type": "prometheus", "uid": "${ds_prom}" }, "legendFormat": "Succeeded", "expr": "count(k8s_pod_phase{k8s_cluster_name=~\"$cluster\"} == 3) or on() vector(0)" } ] },

        { "type": "timeseries", "title": "Container restarts rate (per cluster)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "sum by (k8s_cluster_name) (rate(k8s_container_restarts{k8s_cluster_name=~\"$cluster\"}[$__rate_interval]))",
            "legendFormat": "{{k8s_cluster_name}}" } ] },

        { "type": "row", "title": "Nodes", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 } },

        { "type": "timeseries", "title": "Node CPU (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "k8s_node_cpu_usage{k8s_cluster_name=~\"$cluster\"}",
            "legendFormat": "{{k8s_cluster_name}}/{{k8s_node_name}}" } ] },

        { "type": "timeseries", "title": "Node memory used",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "drawStyle": "line", "fillOpacity": 10 } } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "${ds_prom}" },
            "expr": "k8s_node_memory_usage_bytes{k8s_cluster_name=~\"$cluster\"}",
            "legendFormat": "{{k8s_cluster_name}}/{{k8s_node_name}}" } ] }
      ]
    }

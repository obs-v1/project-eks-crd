# BankObs application health — the consolidated copy of bankobs-service-health.yaml.
#
# The per-service board is one service at a time. This one rolls up every service in
# service_namespace="bankobs": throughput, error-log rate, how many services are
# logging, and the same signals split by service. The Service variable defaults to
# All (regex .*) and is multi-select. Table rows open the per-service health board.
#
# Click-through (datasource-level, panels inherit it):
#   log line  --trace_id derived field-->  Jaeger trace  --tracesToLogsV2-->  Loki logs
#
# Apply with: kubectl --context obs-v1-observability apply -f bankobs-app-service-health.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: bankobs-app-service-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "BankObs"
data:
  bankobs-app-service-health.json: |
    {
      "uid": "bankobs-app-health",
      "title": "BankObs — Application Health (logs + traces)",
      "description": "Consolidated log and trace health for the whole BankObs application. Service defaults to All. Table rows open the per-service health board.",
      "tags": ["bankobs", "logs", "traces", "application"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "links": [
        { "title": "Per-service health", "type": "link", "icon": "dashboard", "keepTime": true, "url": "/d/bankobs-svc-health" },
        { "title": "Application RED", "type": "link", "icon": "dashboard", "keepTime": true, "url": "/d/bankobs-app-red" },
        { "title": "Per-service RED", "type": "link", "icon": "dashboard", "keepTime": true, "url": "/d/bankobs-red-spanmetrics" }
      ],
      "templating": {
        "list": [
          {
            "name": "ds_loki", "label": "Loki", "type": "datasource", "query": "loki",
            "current": { "text": "Loki", "value": "loki" }
          },
          {
            "name": "ds_jaeger", "label": "Jaeger", "type": "datasource", "query": "jaeger",
            "current": { "text": "Jaeger", "value": "jaeger" }
          },
          {
            "name": "service", "label": "Service", "type": "query",
            "datasource": { "type": "loki", "uid": "${ds_loki}" },
            "query": { "label": "service_name", "stream": "{service_namespace=\"bankobs\"}", "type": 1 },
            "refresh": 2, "sort": 1, "includeAll": true, "allValue": ".*", "multi": true,
            "current": { "text": "All", "value": "$__all", "selected": true }
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Log throughput (lines/s)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=~\"$service\"} [$__rate_interval]))" }
          ]
        },
        {
          "id": 2, "type": "stat", "title": "Error log rate (lines/s)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "red", "value": 0.1 } ] } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b` [$__rate_interval]))" }
          ]
        },
        {
          "id": 3, "type": "stat", "title": "Services logging",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "count(count by (service_name) (rate({service_namespace=\"bankobs\", service_name=~\"$service\"} [$__rate_interval])))" }
          ]
        },
        {
          "id": 4, "type": "stat", "title": "Services emitting errors",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 0, "color": { "mode": "thresholds" },
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "count(count by (service_name) (rate({service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b` [$__rate_interval])))" }
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Log volume by level",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "custom": { "fillOpacity": 30, "stacking": { "mode": "normal" } } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "legendFormat": "{{detected_level}}",
              "expr": "sum by (detected_level) (rate({service_namespace=\"bankobs\", service_name=~\"$service\"} [$__rate_interval]))" }
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Request vs error rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs" } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" }, "legendFormat": "all",
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=~\"$service\"} [$__rate_interval]))" },
            { "refId": "B", "datasource": { "type": "loki", "uid": "${ds_loki}" }, "legendFormat": "errors",
              "expr": "sum(rate({service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b` [$__rate_interval]))" }
          ]
        },
        {
          "id": 7, "type": "timeseries", "title": "Log rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "legendFormat": "{{service_name}}",
              "expr": "topk(12, sum by (service_name) (rate({service_namespace=\"bankobs\", service_name=~\"$service\"} [$__rate_interval])))" }
          ]
        },
        {
          "id": 8, "type": "timeseries", "title": "Error log rate by service",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "fieldConfig": { "defaults": { "unit": "logs", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "legendFormat": "{{service_name}}",
              "expr": "topk(12, sum by (service_name) (rate({service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b` [$__rate_interval])))" }
          ]
        },
        {
          "id": 9, "type": "table", "title": "Services ranked by error-log rate (click → per-service health)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "options": { "sortBy": [ { "displayName": "Errors/s", "desc": true } ] },
          "targets": [
            { "refId": "A", "instant": true, "queryType": "instant", "datasource": { "type": "loki", "uid": "${ds_loki}" },
              "expr": "topk(30, sum by (service_name) (rate({service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b` [$__rate_interval])))" }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true },
              "renameByName": { "service_name": "Service", "Value": "Errors/s" } } }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "Service" }, "properties": [
                { "id": "links", "value": [
                  { "title": "Per-service health", "url": "/d/bankobs-svc-health?var-service=${__data.fields.Service}&${__url_time_range}" },
                  { "title": "Per-service RED", "url": "/d/bankobs-red-spanmetrics?var-service=${__data.fields.Service}&${__url_time_range}" }
                ] }
              ] },
              { "matcher": { "id": "byName", "options": "Errors/s" }, "properties": [ { "id": "unit", "value": "logs" }, { "id": "decimals", "value": 3 } ] }
            ]
          }
        },
        {
          "id": 10, "type": "logs", "title": "Error logs  (click a line → trace_id → Jaeger)",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 28 },
          "datasource": { "type": "loki", "uid": "${ds_loki}" },
          "options": { "showTime": true, "showLabels": true, "wrapLogMessage": true, "enableLogDetails": true, "dedupStrategy": "none", "sortOrder": "Descending" },
          "targets": [
            { "refId": "A", "datasource": { "type": "loki", "uid": "${ds_loki}" }, "maxLines": 300,
              "expr": "{service_namespace=\"bankobs\", service_name=~\"$service\"} |~ `(?i)\\b(error|exception|fatal|panic)\\b`" }
          ]
        }
      ]
    }

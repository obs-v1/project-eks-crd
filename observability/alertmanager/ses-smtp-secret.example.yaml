# Example SES secret for Alertmanager — one Secret holds ALL three SES settings.
#
# PREFERRED: `make alertmanager-secret SES_SMTP_USERNAME=… SES_SMTP_PASSWORD=… SES_FROM=…` creates this
# for you without the values ever touching a committed file. Use this manifest only if you manage
# secrets via sealed-secrets / SOPS / an external secrets operator — fill it in there, never commit a
# real password in plaintext.
#
# The SES SMTP *password* is NOT your AWS secret access key. Generate SMTP credentials in the SES
# console (Account dashboard → SMTP settings → Create SMTP credentials); you get an SMTP username and
# an SMTP password.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-ses-smtp
  namespace: monitoring
type: Opaque
stringData:
  # The password is mounted and read via smtp_auth_password_file in values/kube-prometheus-stack.yaml
  # at /etc/alertmanager/secrets/alertmanager-ses-smtp/smtp_password. Alertmanager has no file source
  # for the username/From, so the kps target reads those two keys back out of this Secret and injects
  # them with --set-string at deploy.
  smtp_auth_username: "REPLACE_WITH_SES_SMTP_USERNAME"
  smtp_password: "REPLACE_WITH_SES_SMTP_PASSWORD"
  smtp_from: "observability-alerts@lab.example.com"

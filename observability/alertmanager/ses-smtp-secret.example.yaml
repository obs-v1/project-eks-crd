# Example SES SMTP password secret for Alertmanager.
#
# PREFERRED: `make alertmanager-secret SES_SMTP_PASSWORD=<ses-smtp-password>` creates this for you
# without the value ever touching a committed file. Use this manifest only if you manage secrets
# via sealed-secrets / SOPS / an external secrets operator — fill it in there, never commit a real
# password in plaintext.
#
# The SES SMTP *password* is NOT your AWS secret access key. Generate SMTP credentials in the SES
# console (Account dashboard → SMTP settings → Create SMTP credentials); you get an SMTP username
# (goes in SES_SMTP_USERNAME / the kps config) and an SMTP password (goes here).
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-ses-smtp
  namespace: monitoring
type: Opaque
stringData:
  # Referenced by the global smtp_auth_password_file in values/kube-prometheus-stack.yaml at
  #   /etc/alertmanager/secrets/alertmanager-ses-smtp/smtp_password
  smtp_password: "REPLACE_WITH_SES_SMTP_PASSWORD"

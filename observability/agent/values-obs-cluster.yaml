# obs-cluster CLUSTER-state collector (runs IN the observability cluster, context obs-v1-observability).
#
# Same role as bankobs-cluster but for the OBS cluster's own objects: k8s_cluster → pod phase,
# Deployment/StatefulSet desired-vs-ready, container restarts, node conditions, quotas. Single
# instance (mode: deployment, replicaCount: 1) for the same duplicate-series reason. Forwards to
# the LOCAL gateway.
mode: deployment
replicaCount: 1
fullnameOverride: obs-cluster

image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

presets:
  clusterMetrics: { enabled: true }   # k8s_cluster receiver + cluster-wide RBAC (get/list/watch)

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 512Mi }

config:
  receivers:
    k8s_cluster:
      collection_interval: 15s
      allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
  processors:
    memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25 }
    batch:          { timeout: 5s, send_batch_size: 1024 }
    resource:
      attributes:
        - { key: deployment.environment, value: training, action: upsert }
        - { key: k8s.cluster.name, value: obs-v1-observability, action: upsert }
  exporters:
    otlp:
      endpoint: otel-collector.monitoring.svc.cluster.local:4317   # local gateway, same cluster
      tls: { insecure: true }
    debug: { verbosity: basic }
  service:
    pipelines:
      metrics:
        receivers: [k8s_cluster]
        processors: [memory_limiter, resource, batch]
        exporters: [otlp]

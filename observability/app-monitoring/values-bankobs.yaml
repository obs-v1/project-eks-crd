# BankObs — OPTIONAL SES pipeline smoke-test. Deploy:
#   make app-monitoring         # applies every service's OWN rules + routing (the real alerting)
#   make pipeline-test          # fire this probe once to confirm SES delivery, then:
#   make pipeline-test-off
#
# Routing (who is paged) now lives per-service: each app/<svc> chart carries both its
# PrometheusRule (what to alert on) and its AlertmanagerConfig (who to e-mail), from that
# service's values.yaml `monitoring:` block. This file only aims the end-to-end probe e-mail.

app:
  name: bankobs
  namespace: monitoring      # CRs live where Prometheus/Alertmanager run (the obs cluster)

enableTestAlert: false       # `make pipeline-test` sets this true, `pipeline-test-off` resets it
testEmail: "platform-sre@example.com"

{{- include "app-monitoring.validate" . -}}
{{- if .Values.enableTestAlert }}
# Optional pipeline probe ONLY. The real alert rules live per-service in each app/<svc> chart
# (app/<svc>/templates/prometheusrule.yaml), applied to this cluster by `make app-monitoring`.
# This always-firing rule exists just to prove PrometheusRule → Alertmanager → SES end to end;
# it is rendered only when enableTestAlert=true. Prometheus discovers it from any namespace
# (ruleSelectorNilUsesHelmValues:false); the AlertmanagerConfig below routes it by its labels.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Values.app.name }}-pipeline-test
  namespace: {{ .Values.app.namespace }}
  labels:
    app.kubernetes.io/managed-by: app-monitoring
    app: {{ .Values.app.name }}
spec:
  groups:
    - name: {{ .Values.app.name }}.pipeline-test
      rules:
        - alert: {{ .Values.app.name }}AlertPipelineTest
          expr: "vector(1)"
          labels:
            severity: "info"
            team: {{ .Values.defaultTeam | quote }}
            app: {{ .Values.app.name | quote }}
          annotations:
            summary: "Alert pipeline test for {{ .Values.app.name }}"
            description: "If you received this e-mail, PrometheusRule → Alertmanager → SES works."
{{- end }}

{{- if .Values.enableTestAlert }}
# Self-contained routing for the pipeline PROBE only — matches the test alertname and e-mails
# `testEmail`. This is NOT the routing for real alerts: each app/<svc> chart owns its own
# AlertmanagerConfig (service=<svc> → its recipients). Carries the selector label so the
# Alertmanager CR merges it in; SES transport is inherited from the global kps config.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ .Values.app.name }}-pipeline-test
  namespace: {{ .Values.app.namespace }}
  labels:
    alertmanagerConfig: app-monitoring
    app.kubernetes.io/managed-by: app-monitoring
    app: {{ .Values.app.name }}
spec:
  route:
    receiver: {{ .Values.app.name }}-pipeline-test
    groupBy: ["alertname"]
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 1h
    matchers:
      - name: alertname
        value: {{ printf "%sAlertPipelineTest" .Values.app.name | quote }}
        matchType: "="
  receivers:
    - name: {{ .Values.app.name }}-pipeline-test
      emailConfigs:
        - to: {{ .Values.testEmail | quote }}
          sendResolved: true
{{- end }}

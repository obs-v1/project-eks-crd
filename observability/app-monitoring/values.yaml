# ─────────────────────────────────────────────────────────────────────────────
#  app-monitoring — OPTIONAL SES pipeline smoke-test ONLY.
#
#  Routing (WHO is paged) now lives PER-SERVICE: each app/<svc> chart renders its own
#  AlertmanagerConfig from its values.yaml `monitoring.emails` / `monitoring.criticalEmails`.
#  This chart no longer routes any real alert. It exists solely to prove the pipeline
#  (PrometheusRule → Prometheus → Alertmanager → SES) end to end.
#
#  Deploy the probe, confirm the e-mail arrives, then turn it off:
#    make -C .. pipeline-test        # enableTestAlert=true
#    make -C .. pipeline-test-off    # enableTestAlert=false
# ─────────────────────────────────────────────────────────────────────────────

app:
  # Logical application name — names the probe rule/route and stamps the app label.
  name: example
  # Namespace the CRs are created in. Must be one Alertmanager/Prometheus watch
  # (here: monitoring, on the observability cluster).
  namespace: monitoring

# Set true (or `--set enableTestAlert=true`) to render an always-firing probe alert plus a
# self-contained route that e-mails `testEmail`. This is the ONLY thing this chart renders;
# real per-service alerts + routing come from the app/<svc> charts. Turn it back off after.
enableTestAlert: false

# Where the probe e-mail goes when enableTestAlert=true. The SES transport (smarthost/auth/
# From) is inherited from the global kps Alertmanager config.
testEmail: "platform-sre@example.com"

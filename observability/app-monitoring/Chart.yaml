apiVersion: v2
name: app-monitoring
description: >-
  Optional SES pipeline smoke-test. Routing (WHO is paged) now lives per-service in each
  app/<svc> chart's own AlertmanagerConfig — this chart no longer routes any real alert. When
  enableTestAlert=true it renders one always-firing probe PrometheusRule plus a self-contained
  AlertmanagerConfig that e-mails `testEmail`, to prove PrometheusRule → Alertmanager → SES end
  to end. Metrics collection is unchanged (OTel-only); the SES transport lives in the kps values.
type: application
version: 0.2.0
appVersion: "1.0.0"
keywords:
  - prometheus-operator
  - alerting
  - crd
  - smoke-test

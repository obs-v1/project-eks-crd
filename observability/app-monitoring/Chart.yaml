apiVersion: v2
name: app-monitoring
description: >-
  CRD alerting — the routing half. Renders a Prometheus Operator AlertmanagerConfig
  (WHO is paged — routes each team's alerts to its e-mail receiver) and, when
  enableTestAlert=true, a single always-firing pipeline probe. WHAT to alert on lives
  per-service in each app/<svc> chart's PrometheusRule. Metrics collection is unchanged
  (OTel-only); this chart adds no scraping.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - prometheus-operator
  - alerting
  - crd
